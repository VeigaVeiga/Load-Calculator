  <g fill="#879eaa" opacity=".9"><rect x="275" y="744" width="28" height="7"/><rect x="425" y="702" width="23" height="7"/><rect x="1387" y="757" width="30" height="7"/></g>
  <animateTransform attributeName="transform" type="translate" values="0 0;90 -22;180 -43;0 0" dur="9s" repeatCount="indefinite"/>
 </g>

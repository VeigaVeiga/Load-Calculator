<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f3f5f4"/><stop offset="1" stop-color="#cbd1d0"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#cbd1d1"/><stop offset="1" stop-color="#9fa7a7"/></linearGradient>
 <linearGradient id="steel" x2="1" y2="1"><stop stop-color="#eef1ef"/><stop offset=".45" stop-color="#aeb5b4"/><stop offset="1" stop-color="#666e6e"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#b7c0bf" stop-opacity=".2"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#7d8787" stroke-opacity=".17"/></pattern>
 <mask id="stageMask"><rect width="1920" height="1080" fill="white"/><path d="M390 165 L1530 165 L1640 900 L280 900 Z" fill="black"/></mask>
</defs>
<!-- lightweight illustrated environment; the center is transparent so the live 3D container can sit inside the scene -->
<g mask="url(#stageMask)">
 <rect width="1920" height="1080" fill="url(#wall)"/>
 <path d="M0 650L1920 540V1080H0Z" fill="url(#floor)"/>
 <path d="M0 650L1920 540" stroke="#747d7d" stroke-width="5" opacity=".45"/>
 <path d="M0 720L1920 610M0 800L1920 700M0 900L1920 810" stroke="#ffffff" stroke-opacity=".32" stroke-width="2"/>
 <path d="M0 650L960 1080M260 620L1130 1080M650 600L1320 1080M1050 575L1530 1080M1420 555L1780 1080" stroke="#7f8888" stroke-opacity=".22" stroke-width="2"/>
 <rect y="0" width="1920" height="650" fill="url(#grid)" opacity=".8"/>
 <!-- modular wall -->
 <g fill="none" stroke="#9ba3a2" stroke-width="3" opacity=".9">
  <path d="M60 110H1860M60 260H1860M60 410H1860M60 560H1860"/>
  <path d="M180 60V590M420 60V590M660 60V590M900 60V590M1140 60V590M1380 60V590M1620 60V590"/>
 </g>
 <g fill="url(#glass)" stroke="#aab2b1">

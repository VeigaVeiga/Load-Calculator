  <path d="M0 70V0H65L100 70Z" fill="#d2a33e"/><rect x="38" y="-20" width="45" height="22" fill="#e0b54d"/><path d="M100 25H185V33H100M176 33V105" fill="none"/><circle cx="28" cy="82" r="20" fill="#252b2b"/><circle cx="88" cy="82" r="20" fill="#252b2b"/>
 </g>

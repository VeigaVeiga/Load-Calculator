  <g fill="#c9d0ce" stroke="#7d8583" stroke-width="3"><rect x="18" y="35" width="82" height="72"/><rect x="115" y="35" width="82" height="72"/><rect x="268" y="35" width="82" height="72"/><rect x="365" y="35" width="82" height="72"/><rect x="18" y="130" width="82" height="72"/><rect x="115" y="130" width="82" height="72"/><rect x="268" y="130" width="82" height="72"/><rect x="365" y="130" width="82" height="72"/></g>
 </g>

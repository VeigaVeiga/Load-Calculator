 </g>
 <g fill="#f8faf8" stroke="#9ca4a3" stroke-width="2">
  <rect x="160" y="78" width="230" height="18" rx="8"/><rect x="590" y="66" width="230" height="18" rx="8"/><rect x="1020" y="53" width="230" height="18" rx="8"/><rect x="1450" y="41" width="230" height="18" rx="8"/>
 </g>
 <!-- left storage racks -->

  <g transform="translate(1160 625) scale(.9)"><circle cx="0" cy="-38" r="12"/><path d="M-10 -25Q0 -30 10 -25L15 18L5 18L4 53H-5L-7 18L-17 18Z"/><path d="M-8 2L-30 -5M8 2L29 -12" fill="none" stroke-width="8"/><path d="M-4 53L-20 82M4 53L18 82" fill="none" stroke-width="8"/></g>
  <g transform="translate(740 780) scale(.78)"><circle cx="0" cy="-38" r="12"/><path d="M-10 -25Q0 -30 10 -25L15 18L5 18L4 53H-5L-7 18L-17 18Z"/><path d="M-8 2L-28 27M8 2L30 26" fill="none" stroke-width="8"/><path d="M-4 53L-20 82M4 53L18 82" fill="none" stroke-width="8"/></g>
 </g>
 <!-- floor markings -->
 <g fill="none" stroke="#d2a33e" stroke-width="7" opacity=".8"><path d="M40 970H510"/><path d="M1380 965H1880"/><path d="M1020 980L1240 930"/></g>
 <g fill="#525b5a" font-family="Arial,sans-serif"><text x="70" y="1020" font-size="22" letter-spacing="5">LOGISTICS TEST FACILITY</text><text x="1570" y="1020" font-size="16" letter-spacing="4">LOADING BAY 04</text></g>
</g>
</svg>
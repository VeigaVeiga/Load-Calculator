<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#dfe4e5"/><stop offset=".52" stop-color="#b7bec0"/><stop offset="1" stop-color="#7d8586"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#aeb5b6"/><stop offset="1" stop-color="#5f6869"/></linearGradient>
  <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f0f2f1"/><stop offset=".45" stop-color="#aeb5b4"/><stop offset="1" stop-color="#5d6565"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#f8faf9" stop-opacity=".58"/><stop offset="1" stop-color="#9fa8a8" stop-opacity=".2"/></linearGradient>
  <linearGradient id="belt" x2="0" y2="1"><stop stop-color="#444b4b"/><stop offset="1" stop-color="#252b2b"/></linearGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>

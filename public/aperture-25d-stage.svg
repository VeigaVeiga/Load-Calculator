  <pattern id="wallGrid" width="120" height="100" patternUnits="userSpaceOnUse"><path d="M120 0H0V100" fill="none" stroke="#687273" stroke-opacity=".18" stroke-width="2"/></pattern>
  <pattern id="floorGrid" width="90" height="45" patternUnits="userSpaceOnUse"><path d="M0 0H90M0 0V45" fill="none" stroke="#e7e9e8" stroke-opacity=".18" stroke-width="2"/></pattern>
</defs>

name: fix-ui-controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: python3 scripts/fix-ui-controls.py
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ContainerScene.tsx src/components/CargoProperties.tsx src/components/SceneOverrides.css
          git commit -m 'Fix transform axes units persistence and fixed toolbar' || true
          git push
      - name: Remove temporary workflow and patcher
        run: |
          rm -f .github/workflows/fix-ui-controls.yml scripts/fix-ui-controls.py
          git add -A
          git commit -m 'Remove temporary UI fix workflow' || true
          git push

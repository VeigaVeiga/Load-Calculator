name: Import and crop requested KFC meme

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-import-kfc-meme.yml"

permissions:
  contents: write

jobs:
  import-meme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact VME50 image and crop for the sidebar
        run: |
          python -m pip install --quiet Pillow
          curl --fail --location --retry 3 "https://r2.vme.im/memes/1769666983755-8bc2f86c1eed.png" -o /tmp/source.png
          python - <<'PY'
          from PIL import Image
          image = Image.open('/tmp/source.png').convert('RGB')
          width, height = image.size
          target_ratio = 1200 / 420
          if width / height > target_ratio:
              new_width = round(height * target_ratio)
              left = (width - new_width) // 2
              image = image.crop((left, 0, left + new_width, height))
          else:
              new_height = round(width / target_ratio)
              top = (height - new_height) // 2
              image = image.crop((0, top, width, top + new_height))
          image = image.resize((1200, 420), Image.Resampling.LANCZOS)
          image.save('public/kfc-meme.jpg', 'JPEG', quality=90, optimize=True)
          print(f'Imported requested source image; original={width}x{height}, saved=1200x420')
          PY
      - name: Commit the fixed local asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kfc-meme.jpg
          git commit -m "Replace meme with requested VME50 image crop" || exit 0
          git push

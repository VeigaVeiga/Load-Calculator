name: One-time Orbit lock fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-orbit-lock:
    if: github.actor == 'VeigaVeiga'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove external OrbitControls enabled lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ContainerScene.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'return <OrbitControls ref={controls} enabled={!dragging} makeDefault enableDamping dampingFactor={.08} rotateSpeed={.7} panSpeed={.65} zoomSpeed={.8} minDistance={1.2} maxDistance={45} />'
          new = 'return <OrbitControls ref={controls} makeDefault enableDamping dampingFactor={.08} rotateSpeed={.7} panSpeed={.65} zoomSpeed={.8} minDistance={1.2} maxDistance={45} />'
          if old not in text:
              raise SystemExit('Expected OrbitControls line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Veiga"
          git config user.email "50994187+VeigaVeiga@users.noreply.github.com"
          git add src/components/ContainerScene.tsx
          git commit -m "Fix OrbitControls state after cargo transform"
          git push

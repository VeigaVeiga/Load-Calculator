name: Rebuild meme image on white background

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-white-meme.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and composite the exact source image onto white
        run: |
          python -m pip install --quiet Pillow
          curl --fail --location --retry 3 "https://r2.vme.im/memes/1769666983755-8bc2f86c1eed.png" -o /tmp/source.png
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/source.png').convert('RGBA')
          w, h = src.size
          # Composite transparency onto white before cropping, so transparent
          # RGB values can never leak into the resulting image as green/black.
          white = Image.new('RGBA', src.size, (255, 255, 255, 255))
          white.alpha_composite(src)
          image = white.convert('RGB')
          target_ratio = 1200 / 420
          if w / h > target_ratio:
              crop_w = round(h * target_ratio)
              left = (w - crop_w) // 2
              image = image.crop((left, 0, left + crop_w, h))
          else:
              crop_h = round(w / target_ratio)
              top = (h - crop_h) // 2
              image = image.crop((0, top, w, top + crop_h))
          image = image.resize((1200, 420), Image.Resampling.LANCZOS)
          image.save('public/kfc-meme.jpg', 'JPEG', quality=92, optimize=True)
          print(f'Original {w}x{h}; white-composited crop saved as 1200x420')
          PY
      - name: Commit the corrected local image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kfc-meme.jpg
          git commit -m "Composite meme onto white background" || exit 0
          git push

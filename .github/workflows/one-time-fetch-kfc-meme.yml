name: One-time fetch fixed meme asset
on:
  push:
    branches:
      - fix/v50-copy-and-meme-asset
    paths:
      - .github/workflows/one-time-fetch-kfc-meme.yml
permissions:
  contents: write
jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v50-copy-and-meme-asset
          fetch-depth: 0
      - name: Download fixed VME50 meme and remove temporary workflow
        run: |
          mkdir -p public
          curl --fail --location --retry 3 --output public/kfc-meme.jpg 'https://r2.vme.im/memes/1790233121764-556d81d535a4.jpg'
          file public/kfc-meme.jpg
          test -s public/kfc-meme.jpg
          rm .github/workflows/one-time-fetch-kfc-meme.yml
      - name: Commit local image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/kfc-meme.jpg .github/workflows/one-time-fetch-kfc-meme.yml
          git commit -m "Store fixed VME50 meme locally"
          git push origin HEAD:fix/v50-copy-and-meme-asset

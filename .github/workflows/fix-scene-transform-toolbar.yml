name: fix-scene-transform-toolbar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-scene-transform-toolbar.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scene transform and toolbar
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/ContainerScene.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react'", "import React, { useCallback, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react'")
          s=s.replace("import { Canvas, useThree } from '@react-three/fiber'", "import { Canvas, useThree } from '@react-three/fiber'\nimport { createRoot, type Root } from 'react-dom/client'")
          s=s.replace("  onDeleteMaterial?: (id: string) => void\n}", "  onDeleteMaterial?: (id: string) => void\n  toolbarHost?: HTMLElement | null\n}")
          old="""function CargoObject({ p, container, selected, onSelect, registerRef, showName }: { p: PlacedCargo; container: Container; selected: boolean; onSelect: () => void; registerRef: (id: string, o: THREE.Group | null) => void; showName: boolean }) {\n  const ref = useRef<THREE.Group>(null)\n  useEffect(() => { registerRef(p.id, ref.current); return () => registerRef(p.id, null) }, [p.id, registerRef])\n  const pos: [number, number, number] = [(p.x + p.length / 2 - container.length / 2) * S, (p.y + p.width / 2 - container.width / 2) * S, (p.z + p.height / 2) * S]\n  return <group ref={ref} position={pos} rotation={[0, 0, p.rotation * Math.PI / 180]} onPointerDown={e => { e.stopPropagation(); onSelect() }} onClick={e => { e.stopPropagation(); onSelect() }}>"""
          new="""function CargoObject({ p, container, selected, onSelect, registerRef, showName }: { p: PlacedCargo; container: Container; selected: boolean; onSelect: () => void; registerRef: (id: string, o: THREE.Group | null) => void; showName: boolean }) {\n  const ref = useRef<THREE.Group>(null)\n  useEffect(() => { registerRef(p.id, ref.current); return () => registerRef(p.id, null) }, [p.id, registerRef])\n  // TransformControls owns the live Three.js transform. React selection re-renders must not overwrite it.\n  useLayoutEffect(() => {\n    const o = ref.current\n    if (!o) return\n    const d = dims(p)\n    o.position.set((p.x + d.length / 2 - container.length / 2) * S, (p.y + d.width / 2 - container.width / 2) * S, (p.z + p.height / 2) * S)\n    o.rotation.set(0, 0, p.rotation * Math.PI / 180)\n  }, [p.x, p.y, p.z, p.rotation, p.length, p.width, p.height, container.length, container.width])\n  return <group ref={ref} onPointerDown={e => { e.stopPropagation(); onSelect() }} onClick={e => { e.stopPropagation(); onSelect() }}>"""
          if old not in s: raise SystemExit('CargoObject pattern not found')
          s=s.replace(old,new)
          old_html="<Html fullscreen zIndexRange={[10000, 0]} style={{ pointerEvents: 'none' }}><div className=\"scene-toolbar-portal\" style={{ pointerEvents: 'auto', position: 'absolute', top: 12, left: 12 }}>{toolbar}</div></Html>"
          if old_html not in s: raise SystemExit('toolbar Html pattern not found')
          replacement="""const toolbarRoot = useRef<Root | null>(null)\n  useEffect(() => {\n    const host = props.toolbarHost\n    if (!host) return\n    if (!toolbarRoot.current) toolbarRoot.current = createRoot(host)\n    toolbarRoot.current.render(toolbar)\n    return () => { toolbarRoot.current?.unmount(); toolbarRoot.current = null }\n  }, [props.toolbarHost, tool, activeMaterial?.id, props.selectedMaterialId, freePlacementEnabled])"""
          s=s.replace(old_html,replacement)
          old_end="""export default function ContainerScene(props: Props) {\n  const [selectedMaterialId, setSelectedMaterialId] = useState<string | null>(null)\n  return <div className=\"scene-shell\" style={{ position: 'relative', width: '100%', height: '100%' }}>\n    <Canvas shadows dpr={[1, 1.4]} gl={{ antialias: true, powerPreference: 'high-performance' }} camera={{ position: [10, 8, 6], fov: 42, near: .01, far: 120, up: [0, 0, 1] }} onPointerMissed={() => { props.onSelect(null); props.onSelectMany([]); setSelectedMaterialId(null) }}>\n      <SceneContent props={{ ...props, selectedMaterialId, onSelectMaterial: setSelectedMaterialId }} />\n    </Canvas>\n  </div>\n}"""
          new_end="""export default function ContainerScene(props: Props) {\n  const [selectedMaterialId, setSelectedMaterialId] = useState<string | null>(null)\n  const [toolbarHost, setToolbarHost] = useState<HTMLDivElement | null>(null)\n  return <div className=\"scene-shell\" style={{ position: 'relative', width: '100%', height: '100%' }}>\n    <Canvas shadows dpr={[1, 1.4]} gl={{ antialias: true, powerPreference: 'high-performance' }} camera={{ position: [10, 8, 6], fov: 42, near: .01, far: 120, up: [0, 0, 1] }} onPointerMissed={() => { props.onSelect(null); props.onSelectMany([]); setSelectedMaterialId(null) }}>\n      <SceneContent props={{ ...props, selectedMaterialId, onSelectMaterial: setSelectedMaterialId, toolbarHost }} />\n    </Canvas>\n    <div ref={setToolbarHost} className=\"scene-toolbar-host\" style={{ position: 'absolute', top: 12, left: 12, zIndex: 50, pointerEvents: 'none' }} />\n  </div>\n}"""
          if old_end not in s: raise SystemExit('ContainerScene footer pattern not found')
          s=s.replace(old_end,new_end)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ContainerScene.tsx
          git commit -m 'Fix cargo transform persistence and detach scene toolbar' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-scene-transform-toolbar.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary scene fix workflow' || true
          git push || true

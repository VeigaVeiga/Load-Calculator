name: Fix R3F toolbar crash
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fix toolbar renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/ContainerScene.tsx')
          s=p.read_text()
          s=s.replace("import { createPortal } from 'react-dom'\n", "")
          old="{typeof document !== 'undefined' ? createPortal(<div className=\"scene-toolbar-portal\">{toolbar}</div>, document.body) : null}"
          new="<Html fullscreen zIndexRange={[10000, 0]} style={{ pointerEvents: 'none' }}><div className=\"scene-toolbar-portal\" style={{ pointerEvents: 'auto', position: 'absolute', top: 12, left: 12 }}>{toolbar}</div></Html>"
          if old not in s:
              raise SystemExit('toolbar expression not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ContainerScene.tsx
          git commit -m "Fix R3F toolbar DOM crash" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-r3f-toolbar.yml || true
          git commit -m "Remove one-time toolbar fix workflow" || true
          git push || true

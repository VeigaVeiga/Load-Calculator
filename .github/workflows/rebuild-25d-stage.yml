name: Rebuild 2.5D stage shell
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, '[skip-25d]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert viewer to 2.5D stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/ContainerScene.tsx')
          s=p.read_text()
          s=s.replace('/aperture-logistics-2d.svg','/aperture-25d-stage.svg')
          old='''export default function ContainerScene(props:Props){const [selectedMaterialId,setSelectedMaterialId]=useState<string|null>(null),[toolbarHost,setToolbarHost]=useState<HTMLDivElement|null>(null);return <div className="scene-shell" style={{position:'relative',width:'100%',height:'100%'}}><Canvas shadows dpr={[1,1.4]} gl={{antialias:true,powerPreference:'high-performance'}} camera={{position:[10,8,6],fov:42,near:.01,far:120,up:[0,0,1]}} onPointerMissed={()=>{props.onSelect(null);props.onSelectMany([]);setSelectedMaterialId(null)}}><SceneContent props={{...props,selectedMaterialId,onSelectMaterial:setSelectedMaterialId,toolbarHost}}/></Canvas><div ref={setToolbarHost} className="scene-toolbar-host" style={{position:'absolute',top:12,left:12,zIndex:50,pointerEvents:'none'}}/></div>\n}'''
          new='''export default function ContainerScene(props:Props){const [selectedMaterialId,setSelectedMaterialId]=useState<string|null>(null),[toolbarHost,setToolbarHost]=useState<HTMLDivElement|null>(null);return <div className="scene-shell scene-25d" data-25d-stage="true" style={{position:'relative',width:'100%',height:'100%',overflow:'hidden'}}><div className="stage-25d-background" aria-hidden="true"><img src="/aperture-25d-stage.svg" alt="" draggable={false}/><div className="stage-25d-vignette"/></div><Canvas shadows dpr={[1,1.15]} gl={{alpha:true,antialias:true,powerPreference:'high-performance'}} style={{position:'absolute',inset:0,zIndex:2,background:'transparent'}} camera={{position:[10,8,6],fov:42,near:.01,far:120,up:[0,0,1]}} onPointerMissed={()=>{props.onSelect(null);props.onSelectMany([]);setSelectedMaterialId(null)}}><SceneContent props={{...props,selectedMaterialId,onSelectMaterial:setSelectedMaterialId,toolbarHost}}/></Canvas><div ref={setToolbarHost} className="scene-toolbar-host" style={{position:'absolute',top:12,left:12,zIndex:50,pointerEvents:'none'}}/></div>\n}'''
          if 'data-25d-stage="true"' not in s:
            if old not in s: raise SystemExit('ContainerScene target not found')
            s=s.replace(old,new)
          p.write_text(s)
          css=Path('src/components/SceneOverrides.css')
          c=css.read_text() if css.exists() else ''
          addition='''\n.scene-25d .stage-25d-background{position:absolute;inset:0;z-index:0;overflow:hidden;background:#cfd5d7}\n.scene-25d .stage-25d-background img{position:absolute;inset:-1%;width:102%;height:102%;display:block;object-fit:cover;object-position:center;user-select:none;pointer-events:none;image-rendering:auto}\n.scene-25d .stage-25d-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 46%,rgba(48,56,58,.14) 100%)}\n.scene-25d canvas{z-index:2!important}\n.scene-25d .scene-toolbar-host{z-index:20!important}\n'''
          if '.scene-25d .stage-25d-background' not in c:
            css.write_text(c+addition)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ContainerScene.tsx src/components/SceneOverrides.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild 2.5D stage as live background [skip-25d]'
          git push

name: Fix R3F toolbar portal crash
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/fix-r3f-portal.py
      - run: npm ci
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/fix-r3f-portal.py .github/workflows/fix-r3f-portal.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix R3F toolbar portal crash"
          git push

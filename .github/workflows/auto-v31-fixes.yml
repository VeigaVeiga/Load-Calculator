name: Apply V31 fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V31 automated fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          s = app.read_text(encoding='utf-8')

          s = s.replace('<h1>{tr.title}</h1>', '<h1>{tr.title} <span className="beta-badge">Beta</span></h1>')
          s = re.sub(r'\n\s*<span>\{tr\.axis\}</span>\n', '\n', s)

          old_mode = '''<div className="toolbar-group"><b>{lang==='zh'?'模式':'MODE'}</b>\n              <button className={selectionMode==='single'?'active':''} onClick={()=>setSelectionMode('single')}>{tr.singleSelect}</button>\n              <button className={selectionMode==='box'?'active':''} onClick={()=>setSelectionMode('box')}>{tr.boxSelect}</button>\n              <button className={freePlacement?'active':''} onClick={()=>setFreePlacement(v=>!v)}>{tr.freePlacement}</button>\n            </div>'''
          new_mode = '''<div className="toolbar-group"><b>{lang==='zh'?'模式':'MODE'}</b>\n              <button className={selectionMode==='box'?'active':''} onClick={()=>setSelectionMode('box')}>{lang==='zh'?'多选':'MULTI SELECT'}</button>\n              <button className={freePlacement?'active':''} onClick={()=>setFreePlacement(v=>!v)}>{tr.freePlacement}</button>\n            </div>'''
          s = s.replace(old_mode, new_mode)

          old_add = '''      x: 350 + ((n - 1) % 8) * 1450,\n      y: 3000 - 50 - Math.floor((n - 1) / 8) * 950,'''
          new_add = '''      x: Math.max(0, Math.round(container.length / 2 - 500)),\n      y: Math.max(0, Math.round(container.width / 2 - 500)),'''
          s = s.replace(old_add, new_add)
          s = re.sub(r"\n    material\.y = Math\.round\(container\.width / 2 \+ 3000[^\n]*\)", '', s)

          marker = '''  const scaleMaterial = (id:string, factor:number) => {'''
          if 'const deleteMaterial =' not in s:
              s = s.replace(marker, '''  const deleteMaterial = (id:string) => {\n    setMaterials(items => items.filter(m => m.id !== id))\n    setSelectedId(null)\n    setSelectedIds([])\n  }\n\n'''+marker)

          s = s.replace('              onMaterialScale={scaleMaterial}\n', '              onMaterialScale={scaleMaterial}\n              onDeleteMaterial={deleteMaterial}\n')

          # Export only what is actually present in the 3D plan. Blank all template\n          # data rows after the first data row so old sample cargo cannot leak through.
          old_export = '''const totalWeight=cargo.reduce((sum,c)=>sum+c.weight*c.quantity,0);const cargoLines=cargo.map(c=>`${c.name} × ${Math.floor(c.quantity)}`).join('；');const dimsLines=cargo.map(c=>`${c.length}×${c.width}×${c.height}`).join('；');const typeLines=cargo.map(c=>c.type==='pallet'?tr.pallet:c.type==='woodCrate'?tr.crate:tr.carton).join('；');const first=Array.from(rows[2]?.getElementsByTagNameNS(w,'tc')||[]);if(first.length>=7){setCellText(first[1],cargoLines||'-');setCellText(first[2],String(cargo.reduce((s,c)=>s+Math.floor(c.quantity),0)));setCellText(first[3],cargo.length===1?cargo[0].weight.toFixed(1):'-');setCellText(first[4],totalWeight.toFixed(1));setCellText(first[5],dimsLines||'-');setCellText(first[6],typeLines||'-')}'''
          new_export = '''const loadedById=new Map<string,PlacedCargo[]>();for(const p of placed){const a=loadedById.get(p.cargoId)||[];a.push(p);loadedById.set(p.cargoId,a)};const loaded=cargo.filter(c=>(loadedById.get(c.id)?.length||0)>0);const totalWeight=placed.reduce((sum,p)=>sum+p.weight,0);const cargoLines=loaded.map(c=>`${c.name} × ${(loadedById.get(c.id)||[]).length}`).join('；');const dimsLines=loaded.map(c=>{const p=(loadedById.get(c.id)||[])[0];const d=p.rotation%180===0?{l:p.length,w:p.width}:{l:p.width,w:p.length};return `${d.l}×${d.w}×${p.height}`}).join('；');const typeLines=loaded.map(c=>c.type==='pallet'?tr.pallet:c.type==='woodCrate'?tr.crate:tr.carton).join('；');const first=Array.from(rows[2]?.getElementsByTagNameNS(w,'tc')||[]);for(const r0 of rows.slice(3)){for(const cell of Array.from(r0.getElementsByTagNameNS(w,'tc')))setCellText(cell,'')};if(first.length>=7){setCellText(first[1],cargoLines||'-');setCellText(first[2],String(placed.length));setCellText(first[3],loaded.length===1?(loaded[0].weight||0).toFixed(1):'-');setCellText(first[4],totalWeight.toFixed(1));setCellText(first[5],dimsLines||'-');setCellText(first[6],typeLines||'-')}'''
          s = s.replace(old_export, new_export)

          app.write_text(s, encoding='utf-8')

          css = Path('src/App.css')
          c = css.read_text(encoding='utf-8')
          c += '''\n\n/* V31 cleanup */\n.beta-badge{display:inline-block;margin-left:7px;padding:2px 6px;border:1px solid #9a5c2d;border-radius:3px;font-size:.42em;letter-spacing:.08em;vertical-align:middle;color:#9a5c2d;background:#eee4d5;text-transform:none}.scene-toolbox{background:rgba(36,40,40,.94)!important;border:1px solid #777!important;box-shadow:4px 4px 0 rgba(0,0,0,.18)!important;border-radius:4px!important;padding:7px!important;gap:5px!important}.scene-toolbox button{background:#eee9de!important;color:#24292a!important;border:1px solid #767872!important}.scene-toolbox button.active{background:#3b403f!important;color:#fff!important}.scene-toolbox .disabled{opacity:.38!important;cursor:not-allowed!important}.viewer-foot span:last-child{margin-left:auto}\n'''
          css.write_text(c, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css
          git diff --cached --quiet && exit 0
          git commit -m "V31 automated fixes"
          git push

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/auto-v31-fixes.yml
          git commit -m "Remove one-shot V31 workflow"
          git push

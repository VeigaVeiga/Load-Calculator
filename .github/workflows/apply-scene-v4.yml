name: apply-scene-v4
on:
  push:
    paths:
      - 'scripts/fix_scene_v4.py'
      - '.github/workflows/apply-scene-v4.yml'
permissions:
  contents: write
jobs:
  patch-build-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 scripts/fix_scene_v4.py
      - run: npm ci
      - run: npm run build
      - name: Commit patched scene and remove helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix_scene_v4.py .github/workflows/apply-scene-v4.yml
          git add src/components/ContainerScene.tsx scripts/fix_scene_v4.py .github/workflows/apply-scene-v4.yml
          git commit -m 'Improve free placement focus and collision handling'
          git push

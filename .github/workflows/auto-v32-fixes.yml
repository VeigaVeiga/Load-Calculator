name: Apply V32 fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'V32 automated fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          s = app.read_text(encoding='utf-8')

          # Material creation returns its id so Ctrl-drag can duplicate the selected material.
          s = s.replace("  const addMaterial = (\n    type: SecuringMaterialType,\n  ) => {", "  const addMaterial = (\n    type: SecuringMaterialType,\n  ): string => {")
          s = s.replace("    setMaterials((items) => [\n      ...items,\n      material,\n    ])\n  }", "    setMaterials((items) => [...items, material])\n    return material.id\n  }")

          # Put door net at the actual door; other materials start at the center.
          s = s.replace("      x: Math.max(0, Math.round(container.length / 2 - 500)),\n      y: Math.max(0, Math.round(container.width / 2 - 500)),", "      x: type === 'doorNet' ? Math.max(0, container.length - 40) : Math.max(0, Math.round(container.length / 2 - 500)),\n      y: 0,")

          # Use the real loaded unit weights in the export instead of '-' for mixed cargo.
          s = s.replace("setCellText(first[3],loaded.length===1?(loaded[0].weight||0).toFixed(1):'-')", "setCellText(first[3],loaded.map(c=>(c.weight||0).toFixed(1)).join('；')||'-')")

          # Export securing materials into all three generated view drawings.
          old_top = """    let shapes=''\n    for(const p of placed){const d=p.rotation%180===0?{l:p.length,w:p.width}:{l:p.width,w:p.length};shapes+=rect(bx+p.x/container.length*boxW,by+p.y/container.width*boxH,d.l/container.length*boxW,d.w/container.width*boxH,p.color)}\n    return `<svg"""
          new_top = """    let shapes=''\n    for(const p of placed){const d=p.rotation%180===0?{l:p.length,w:p.width}:{l:p.width,w:p.length};shapes+=rect(bx+p.x/container.length*boxW,by+p.y/container.width*boxH,d.l/container.length*boxW,d.w/container.width*boxH,p.color)}\n    for(const m of materials){const mx=bx+m.x/container.length*boxW,my=by+m.y/container.width*boxH,mw=Math.max(2,m.length/container.length*boxW),mh=Math.max(2,m.width/container.width*boxH);if(m.type==='triangleWood')shapes+=`<polygon points=\"${mx},${my+mh} ${mx+mw},${my+mh} ${mx},${my}\" fill=\"#3979b8\"/>`;else if(m.type==='airBag')shapes+=`<rect x=\"${mx}\" y=\"${my}\" width=\"${mw}\" height=\"${mh}\" rx=\"3\" fill=\"#3fa36b\"/>`;else if(m.type==='lashingBelt')shapes+=`<line x1=\"${mx}\" y1=\"${my+mh/2}\" x2=\"${mx+mw}\" y2=\"${my+mh/2}\" stroke=\"#e86d43\" stroke-width=\"3\"/>`;else shapes+=`<rect x=\"${mx}\" y=\"${my}\" width=\"${mw}\" height=\"${mh}\" fill=\"none\" stroke=\"#737b82\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>`}\n    return `<svg"""
          s = s.replace(old_top, new_top)

          old_side = """    let left='',frontShapes=''\n    for(const p of placed){const d=p.rotation%180===0?{l:p.length,w:p.width}:{l:p.width,w:p.length};left+=rect(side.x+p.x/container.length*side.w,side.y+(1-(p.z+p.height)/container.height)*side.h,d.l/container.length*side.w,p.height/container.height*side.h,p.color);frontShapes+=rect(front.x+p.y/container.width*front.w,front.y+(1-(p.z+p.height)/container.height)*front.h,d.w/container.width*front.w,p.height/container.height*front.h,p.color)}\n    return `<svg"""
          new_side = """    let left='',frontShapes=''\n    for(const p of placed){const d=p.rotation%180===0?{l:p.length,w:p.width}:{l:p.width,w:p.length};left+=rect(side.x+p.x/container.length*side.w,side.y+(1-(p.z+p.height)/container.height)*side.h,d.l/container.length*side.w,p.height/container.height*side.h,p.color);frontShapes+=rect(front.x+p.y/container.width*front.w,front.y+(1-(p.z+p.height)/container.height)*front.h,d.w/container.width*front.w,p.height/container.height*front.h,p.color)}\n    for(const m of materials){const sx=side.x+m.x/container.length*side.w,sy=side.y+(1-(m.z+m.height)/container.height)*side.h,sw=Math.max(2,m.length/container.length*side.w),sh=Math.max(2,m.height/container.height*side.h);const fx=front.x+m.y/container.width*front.w,fy=front.y+(1-(m.z+m.height)/container.height)*front.h,fw=Math.max(2,m.width/container.width*front.w);if(m.type==='triangleWood'){left+=`<polygon points=\"${sx},${sy+sh} ${sx+sw},${sy+sh} ${sx},${sy}\" fill=\"#3979b8\"/>`;frontShapes+=`<polygon points=\"${fx},${fy+sh} ${fx+fw},${fy+sh} ${fx},${fy}\" fill=\"#3979b8\"/>`}else if(m.type==='airBag'){left+=`<rect x=\"${sx}\" y=\"${sy}\" width=\"${sw}\" height=\"${sh}\" fill=\"#3fa36b\"/>`;frontShapes+=`<rect x=\"${fx}\" y=\"${fy}\" width=\"${fw}\" height=\"${sh}\" fill=\"#3fa36b\"/>`}else if(m.type==='lashingBelt'){left+=`<line x1=\"${sx}\" y1=\"${sy+sh/2}\" x2=\"${sx+sw}\" y2=\"${sy+sh/2}\" stroke=\"#e86d43\" stroke-width=\"3\"/>`;frontShapes+=`<line x1=\"${fx}\" y1=\"${fy+sh/2}\" x2=\"${fx+fw}\" y2=\"${fy+sh/2}\" stroke=\"#e86d43\" stroke-width=\"3\"/>`}else{left+=`<rect x=\"${sx}\" y=\"${sy}\" width=\"${sw}\" height=\"${sh}\" fill=\"none\" stroke=\"#737b82\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>`;frontShapes+=`<rect x=\"${fx}\" y=\"${fy}\" width=\"${fw}\" height=\"${sh}\" fill=\"none\" stroke=\"#737b82\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>`}}\n    return `<svg"""
          s = s.replace(old_side, new_side)

          app.write_text(s, encoding='utf-8')

          scene = Path('src/components/ContainerScene.tsx')
          c = scene.read_text(encoding='utf-8')
          c = c.replace("onAddMaterial:(type:SecuringMaterialType)=>void", "onAddMaterial:(type:SecuringMaterialType)=>string")
          # Add Ctrl-drag duplication at the selected material's current position.
          old_down = "onMouseDown={()=>{capture();onDragState(true)}}"
          new_down = "onMouseDown={(event)=>{const native=(event as any).nativeEvent as MouseEvent;if(native.ctrlKey&&activeMaterial){const x=Math.round((activeObject?.position.x||0)/S-activeMaterial.length/2+container.length/2);const y=Math.round((activeObject?.position.y||0)/S-activeMaterial.width/2+container.width/2);const newId=onAddMaterial(activeMaterial.type);onMaterialMove(newId,x,y);props.onSelectMaterial?.(newId)}capture();onDragState(true)}}"
          c = c.replace(old_down, new_down)
          scene.write_text(c, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/ContainerScene.tsx
          git diff --cached --quiet && exit 0
          git commit -m "V32 automated fixes"
          git push

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/auto-v32-fixes.yml
          git commit -m "Remove one-shot V32 workflow"
          git push

name: finalize-ui
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: python3 scripts/finalize_ui.py
      - run: cat >> src/App.css <<'EOF'

.view-toolbar button,.view-toolbar select,.scene-toolbox button,.scene-toolbox b{font-size:13px;line-height:1.2;min-height:32px}
.view-toolbar button,.scene-toolbox button{font-family:inherit;font-weight:600}
.scene-toolbox{z-index:30}
EOF
      - run: npm run build
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-ui.yml scripts/finalize_ui.py
          git add src/App.tsx src/App.css .github/workflows/finalize-ui.yml scripts/finalize_ui.py
          git commit -m 'Finalize UI fixes and manual packing behavior'
          git push